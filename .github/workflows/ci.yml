name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run docs:check
      - run: bun run docs:build
      - name: Check Kerros package
        run: npm pack --dry-run
      - name: Check ESLint plugin package
        run: npm pack --dry-run --workspace @violetflux/eslint-plugin-kerros

  react-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react:
          - 17.0.2
          - 18.3.1
          - 19.2.7
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install React ${{ matrix.react }}
        run: bun add --dev --exact --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: bun run test

  typescript-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript:
          - 5.9.3
          - 6.0.3
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install TypeScript ${{ matrix.typescript }}
        run: bun add --dev --exact --no-save typescript@${{ matrix.typescript }}
      - run: bun run typecheck:plugin
      - run: bun run test:plugin
      - run: bun run build:plugin
